# Netlify configuration for building the frontend from the monorepo root
#
# IMPORTANT: the frontend needs to reach the backend API in production.
# Either set the VITE_API_URL build env var in the Netlify UI
# (e.g. https://api.yourdomain.com/api/v1), or uncomment the /api proxy
# below and point it at the deployed backend. One of the two is REQUIRED —
# otherwise /api/v1/* requests fall through to the SPA catch-all and
# return index.html instead of JSON.
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Uncomment and set the backend host to proxy API calls through Netlify:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOST/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
